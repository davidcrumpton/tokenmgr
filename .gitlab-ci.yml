image: golang:1.24

stages:
  - test

# The end-to-end checks live in scripts/integration-test.sh so the GitHub
# Actions workflow runs exactly the same thing. Keeping them in one place is
# what stops the two pipelines from drifting apart.
tokenmgr:
  stage: test
  script:
    - set -eu
    - go vet ./...
    - go test ./...
    - ./scripts/integration-test.sh
