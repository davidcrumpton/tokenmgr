name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # v7 of the action runs golangci-lint v2, which is what .golangci.yml
      # targets (it declares `version: "2"`). The version is pinned so a new
      # linter release cannot break the build on its own schedule.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -race ./...

      # Same script the GitLab pipeline runs. Exercised on both OSes because
      # the script is POSIX sh and must keep working on macOS's bash 3.2 and
      # on Linux.
      - name: integration
        run: ./scripts/integration-test.sh

  cross-build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/tokenmgr

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # v0.1.1 shipped with ':' in an example filename, which made the module
      # zip unusable and broke `go install ...@v0.1.1` while every other
      # artifact was fine. Nothing else here would notice, so check it
      # explicitly. Validates a `git archive` export with the same library the
      # module proxy uses.
      - name: Module zip is valid
        run: ./scripts/check-module-zip.sh

      # `goreleaser check` exits non-zero while the `brews` property is
      # deprecated (formulae are still supported, and they are what Linuxbrew
      # users need), so the real gate is a full snapshot release with
      # publishing, SBOMs and cosign disabled: it parses every pipe and renders
      # the archive, package, formula and manifest templates.
      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sbom,sign
