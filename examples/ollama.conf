# Protect Ollama behind nginx with TLS and an allow-list of bearer tokens.
#
# Put the map in the http {} block of nginx.conf. Put the server {} block in
# the http {} block too, or in a file included from it (for example,
# /etc/nginx/conf.d/ollama.conf).
#
# Replace each placeholder with a token issued for this endpoint. Treat this
# file as a secret: anyone who can read an allowed token can call Ollama.
# Do not commit real tokens to source control.

map_hash_bucket_size 512;
# Nginx compares the complete Authorization header literally. This is an
# allow-list, not JWT verification; rotate tokens by replacing this map and
# reloading nginx.
map $http_authorization $ollama_authorized {
    default 0;
    "Bearer REPLACE_WITH_TOKEN_1" 1;
    # "Bearer REPLACE_WITH_TOKEN_2" 1;
}

# Example token commands. Run from the repository root, then paste each
# printed token into the map above. Keep the private key and tokens secret.
# Include --exp because tokenmgr itself does not enforce expiration; this
# nginx map still authorizes an expired token until it is removed or rotated.
# tokenmgr issue --key tokenmgr.key --schema-dir ./schemas --schema ollama \
#   --iss homelab-token-manager --sub nginx --aud n8n --exp 720h \
#   --claim service=ollama --claim host=n8n.example.com \
#   --claim purpose="Allow n8n" --claim environment=prod
# tokenmgr issue --key tokenmgr.key --schema-dir ./schemas --schema ollama \
#   --iss homelab-token-manager --sub nginx --aud openwebui --exp 720h \
#   --claim service=ollama --claim host=openwebui.example.com \
#   --claim purpose="Allow Open WebUI" --claim environment=prod

server {
    listen 11444 ssl;
    server_name ollama.example.com;

    ssl_certificate /etc/letsencrypt/live/ollama.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ollama.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Ollama streams generated tokens; buffering and short read timeouts break it.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    error_page 401 = @ollama_unauthorized;

    location / {
        if ($ollama_authorized = 0) {
            return 401;
        }

        # Do not pass the edge credential to the local Ollama process.
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @ollama_unauthorized {
        add_header WWW-Authenticate 'Bearer realm="ollama"' always;
        default_type text/plain;
        return 401 "Unauthorized: invalid or missing Bearer token\n";
    }
}
